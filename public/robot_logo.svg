<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Antenna -->
  <line x1="32" y1="4" x2="32" y2="13" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="3" r="2.5" fill="#f59e0b"/>

  <!-- Head -->
  <rect x="14" y="13" width="36" height="24" rx="7" fill="#111" stroke="#f59e0b" stroke-width="2"/>

  <!-- Eyes -->
  <rect x="19" y="20" width="9" height="9" rx="2.5" fill="#f59e0b" opacity="0.95"/>
  <rect x="36" y="20" width="9" height="9" rx="2.5" fill="#f59e0b" opacity="0.95"/>
  <!-- Eye shine -->
  <rect x="21" y="22" width="3" height="3" rx="1" fill="#fff" opacity="0.5"/>
  <rect x="38" y="22" width="3" height="3" rx="1" fill="#fff" opacity="0.5"/>

  <!-- Mouth -->
  <rect x="22" y="33" width="20" height="2.5" rx="1.25" fill="#f59e0b" opacity="0.6"/>

  <!-- Neck -->
  <rect x="28" y="37" width="8" height="5" rx="2" fill="#222" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Body -->
  <rect x="12" y="42" width="40" height="18" rx="7" fill="#111" stroke="#f59e0b" stroke-width="2"/>

  <!-- Chest panel -->
  <rect x="22" y="46.5" width="20" height="9" rx="3" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Chest dots -->
  <circle cx="27" cy="51" r="2" fill="#f59e0b" opacity="0.8"/>
  <circle cx="32" cy="51" r="2" fill="#f59e0b" opacity="0.5"/>
  <circle cx="37" cy="51" r="2" fill="#f59e0b" opacity="0.3"/>

  <!-- Left Arm -->
  <rect x="2" y="43" width="9" height="15" rx="4.5" fill="#111" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Right Arm -->
  <rect x="53" y="43" width="9" height="15" rx="4.5" fill="#111" stroke="#f59e0b" stroke-width="1.5"/>
</svg>
