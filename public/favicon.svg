<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#111111"/>

  <!-- Antenna -->
  <line x1="32" y1="4" x2="32" y2="12" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="3" r="2.5" fill="#f59e0b"/>

  <!-- Head -->
  <rect x="13" y="12" width="38" height="23" rx="7" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2"/>

  <!-- Eyes -->
  <rect x="18" y="19" width="10" height="10" rx="3" fill="#f59e0b"/>
  <rect x="36" y="19" width="10" height="10" rx="3" fill="#f59e0b"/>
  <rect x="20" y="21" width="3.5" height="3.5" rx="1" fill="#fff" opacity="0.45"/>
  <rect x="38" y="21" width="3.5" height="3.5" rx="1" fill="#fff" opacity="0.45"/>

  <!-- Mouth -->
  <rect x="22" y="32" width="20" height="2" rx="1" fill="#f59e0b" opacity="0.55"/>

  <!-- Neck -->
  <rect x="28" y="35" width="8" height="5" rx="2" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Body -->
  <rect x="11" y="40" width="42" height="20" rx="8" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2"/>

  <!-- Chest -->
  <circle cx="26" cy="50" r="2.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="32" cy="50" r="2.5" fill="#f59e0b" opacity="0.55"/>
  <circle cx="38" cy="50" r="2.5" fill="#f59e0b" opacity="0.3"/>

  <!-- Arms -->
  <rect x="1" y="41" width="9" height="15" rx="4.5" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="54" y="41" width="9" height="15" rx="4.5" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1.5"/>
</svg>